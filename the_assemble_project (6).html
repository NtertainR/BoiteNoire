<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Assemble Project</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for Editorial Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        paper: '#ffffff',
                        ink: '#1a1a1a',
                        canvas: '#e8e8e3',
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Resets & Slider Container */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* CRITICAL: Prevent all native scrolling */
            background-color: #e8e8e3;
            overscroll-behavior: none;
        }

        #slider-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            z-index: 1;
        }

        .slide.active {
            visibility: visible;
            z-index: 2;
        }

        /* The Animated Inner Element */
        .slide-inner {
            will-change: transform, opacity;
            opacity: 0; /* Hidden by default until state is set */
        }

        /* 1.35s Transition applied dynamically */
        .slide-inner.animating {
            transition: transform 1.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* --- ANIMATION STATES --- */
        
        /* Center (Visible) */
        .slide-inner[data-state="center"] {
            transform: translate(0, 0) scale(1) rotate(0deg);
            opacity: 1;
        }

        /* Directions (Start and End positions) */
        .slide-inner[data-state="left"] {
            transform: translate(-150vw, 0) scale(0.84) rotate(-11deg);
            opacity: 0;
        }
        .slide-inner[data-state="right"] {
            transform: translate(150vw, 0) scale(0.84) rotate(11deg);
            opacity: 0;
        }
        .slide-inner[data-state="top"] {
            transform: translate(0, -150vh) scale(0.84) rotate(-11deg);
            opacity: 0;
        }
        .slide-inner[data-state="bottom"] {
            transform: translate(0, 150vh) scale(0.84) rotate(11deg);
            opacity: 0;
        }

        /* Content Styling */
        .page-content {
            background-color: white;
            aspect-ratio: 8.5 / 11;
            width: 90vw;
            max-width: 800px;
            max-height: 90vh; /* Fits on short screens */
            box-shadow: 0 40px 80px -20px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Ensures canvas stays within bounds */
        }

        /* 
         * PDF SOURCE STYLING (Hidden from UI, Strict formatting)
         */
        #pdf-source {
            position: absolute;
            top: -20000px;
            left: -20000px;
            width: 816px; /* 8.5 inches at 96dpi */
            background: white;
        }

        .pdf-page {
            width: 816px;
            height: 1056px; /* 11 inches at 96dpi */
            padding: 80px; 
            box-sizing: border-box;
            background: white;
            page-break-after: always;
            page-break-inside: avoid;
            display: flex;
            flex-direction: column;
            color: #1a1a1a;
        }
    </style>
</head>
<body class="text-ink antialiased">

    <!-- PROGRESS INDICATOR -->
    <div id="progress-container" class="fixed top-0 left-0 w-full h-1.5 bg-gray-300 z-50">
        <div id="progress-bar" class="h-full bg-ink w-0 transition-all duration-700 ease-out shadow-[0_0_10px_rgba(26,26,26,0.5)]"></div>
    </div>

    <!-- FULL VIEWPORT SLIDER -->
    <main id="slider-container">
        <!-- Slides are dynamically injected here -->
        <div id="loading-indicator" class="absolute inset-0 flex items-center justify-center z-50 transition-opacity duration-500">
            <div class="font-sans uppercase tracking-[0.3em] text-sm text-ink animate-pulse">Loading Document...</div>
        </div>
    </main>

    <!-- LOGIC SCRIPTS -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            
            const sliderContainer = document.getElementById('slider-container');
            const progressBar = document.getElementById('progress-bar');
            const loadingIndicator = document.getElementById('loading-indicator');
            
            // Set up PDF.js worker
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            
            const pdfUrl = 'https://raw.githubusercontent.com/mozilla/pdf.js/master/web/compressed.tracemonkey-pldi-09.pdf';
            let sliderHTML = '';

            // --- 1. ASYNC DOCUMENT LOADING & RENDERING ---
            try {
                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                const pdf = await loadingTask.promise;
                
                // Limit to 5 pages for presentation brevity, or use pdf.numPages
                const totalPagesToRender = Math.min(pdf.numPages, 5); 

                for (let pageNum = 1; pageNum <= totalPagesToRender; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    
                    // High scale factor for crisp rendering
                    const scale = 2.5; 
                    const viewport = page.getViewport({ scale: scale });
                    
                    // Create an off-screen canvas to render the page
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    
                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    
                    await page.render(renderContext).promise;
                    
                    // Extract data URL to inject directly into HTML
                    const imgData = canvas.toDataURL('image/jpeg', 0.9);
                    
                    sliderHTML += `
                        <section class="slide">
                            <div class="slide-inner page-content" data-state="bottom">
                                <img src="${imgData}" class="w-full h-full object-contain bg-white" alt="Page ${pageNum}" />
                            </div>
                        </section>
                    `;
                }
            } catch (error) {
                console.warn("Failed to load PDF (likely CORS). Generating fallback slides.", error);
                
                // Fallback Engine if PDF fails to load
                for (let i = 1; i <= 5; i++) {
                    sliderHTML += `
                        <section class="slide">
                            <div class="slide-inner page-content p-8 md:p-12 lg:p-16 flex flex-col items-center justify-center text-center bg-white" data-state="bottom">
                                <h2 class="font-serif text-5xl mb-6 text-gray-300 border-b border-gray-100 w-full pb-4">0${i}</h2>
                                <h3 class="font-sans uppercase tracking-[0.2em] text-lg text-ink font-bold mb-4">Fallback Page</h3>
                                <p class="font-sans text-sm text-gray-500 max-w-md">The external PDF could not be loaded due to CORS restrictions. This layout serves as a placeholder to demonstrate the engine's animation mechanics.</p>
                            </div>
                        </section>
                    `;
                }
            }

            // --- 2. FINAL EPILOGUE SLIDE ---
            sliderHTML += `
                <section class="slide">
                    <div class="slide-inner page-content p-8 md:p-12 lg:p-16 flex flex-col" data-state="bottom">
                        <header class="flex justify-between items-start border-b border-ink pb-4 w-full">
                            <span class="font-sans uppercase text-xs font-semibold tracking-widest">End</span>
                            <span class="font-sans uppercase text-xs font-semibold tracking-widest">Assembly</span>
                        </header>
                        
                        <div class="flex-grow flex flex-col justify-center items-center text-center">
                            <h2 class="font-serif text-5xl md:text-6xl font-bold mb-4">Epilogue</h2>
                            <p class="font-sans text-sm md:text-base text-gray-600 mb-12 max-w-sm">The document has been fully assembled and reviewed. You may now retrieve the source file.</p>
                            
                            <a href="${pdfUrl}" target="_blank" rel="noopener noreferrer" class="group relative px-8 py-5 bg-ink text-paper font-sans uppercase tracking-[0.2em] text-xs font-bold transition-all hover:bg-gray-800 hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-3 w-full max-w-xs shadow-[0_15px_30px_-10px_rgba(0,0,0,0.4)]">
                                <span>Download PDF</span>
                                <svg class="w-4 h-4 transition-transform group-hover:translate-y-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                </svg>
                            </a>
                        </div>
                        
                        <footer class="mt-auto w-full border-t border-ink pt-6 flex justify-between items-end">
                            <div class="font-sans uppercase text-[9px] tracking-widest text-gray-500">System Authorized</div>
                            <div class="text-right text-[10px] font-sans text-gray-400">FIN</div>
                        </footer>
                    </div>
                </section>
            `;

            // Inject and remove loader
            sliderContainer.innerHTML = sliderHTML;
            loadingIndicator.style.opacity = '0';
            setTimeout(() => loadingIndicator.remove(), 500);

            // --- 3. SLIDER & PUSH ANIMATION LOGIC ---
            const slides = document.querySelectorAll('.slide');
            let currentIndex = 0;
            let isAnimating = false;

            function updateProgress() {
                const percent = ((currentIndex + 1) / slides.length) * 100;
                progressBar.style.width = `${percent}%`;
            }

            // Initialize first slide
            if (slides.length > 0) {
                slides[0].classList.add('active');
                slides[0].querySelector('.slide-inner').dataset.state = 'center';
                updateProgress();
            }

            function goToSlide(nextIndex) {
                if (isAnimating || nextIndex < 0 || nextIndex >= slides.length || nextIndex === currentIndex) return;
                
                isAnimating = true;

                const currentSlide = slides[currentIndex];
                const nextSlide = slides[nextIndex];
                const currentInner = currentSlide.querySelector('.slide-inner');
                const nextInner = nextSlide.querySelector('.slide-inner');

                // Randomly select entrance direction
                const directions = ['left', 'right', 'top', 'bottom'];
                const inDir = directions[Math.floor(Math.random() * directions.length)];
                
                // Calculate opposite push out direction
                const opposites = { 'left': 'right', 'right': 'left', 'top': 'bottom', 'bottom': 'top' };
                const outDir = opposites[inDir];

                // Prep incoming slide
                nextInner.dataset.state = inDir;
                nextSlide.classList.add('active'); 

                // CRUCIAL: Force browser reflow to register the off-screen start position properly
                void nextInner.offsetWidth;
                void currentInner.offsetWidth;

                // Add animating classes (Triggers the 1.35s cubic-bezier in CSS)
                nextInner.classList.add('animating');
                currentInner.classList.add('animating');

                // Trigger movement to End states
                nextInner.dataset.state = 'center';
                currentInner.dataset.state = outDir;

                // Post-animation cleanup matching transition duration
                setTimeout(() => {
                    nextInner.classList.remove('animating');
                    currentInner.classList.remove('animating');
                    currentSlide.classList.remove('active'); 
                    
                    currentIndex = nextIndex;
                    updateProgress();
                    isAnimating = false;
                }, 1350);
            }

            // Event Listeners for Navigation (Wheel)
            let scrollTimeout;
            window.addEventListener('wheel', (e) => {
                if (Math.abs(e.deltaY) > 20) {
                    clearTimeout(scrollTimeout);
                    scrollTimeout = setTimeout(() => {
                        if (e.deltaY > 0) goToSlide(currentIndex + 1);
                        else if (e.deltaY < 0) goToSlide(currentIndex - 1);
                    }, 50); 
                }
            }, { passive: true });

            // Event Listeners for Navigation (Touch/Swipe)
            let touchStartY = 0;
            let touchStartX = 0;
            window.addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
                touchStartX = e.touches[0].clientX;
            }, { passive: true });

            window.addEventListener('touchend', (e) => {
                const touchEndY = e.changedTouches[0].clientY;
                const touchEndX = e.changedTouches[0].clientX;
                const diffY = touchStartY - touchEndY;
                const diffX = touchStartX - touchEndX;
                
                if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 50) {
                    if (diffY > 0) goToSlide(currentIndex + 1); 
                    else goToSlide(currentIndex - 1);
                } else if (Math.abs(diffX) > 50) {
                    if (diffX > 0) goToSlide(currentIndex + 1); 
                    else goToSlide(currentIndex - 1);
                }
            }, { passive: true });

        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposition Boite Noire</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">

    <!-- pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        paper: '#ffffff',
                        ink: '#1a1a1a',
                        canvas: '#08080a',
                    }
                }
            }
        }
    </script>

    <style>
        /* --- GLOBAL RESETS --- */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #08080a;
            overflow: hidden;
            overscroll-behavior: none;
            font-family: 'Inter', sans-serif;
            color: white;
        }

        /* --- PHASE 1: 3D UNBOXING SCENE --- */
        :root {
            --box-size: 225px;
            --box-color: #0f0f11;
            --border-color: rgba(255, 255, 255, 0.08);
            --bg-color: #08080a;
        }

        #unboxing-scene {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #2a2a35 0%, var(--bg-color) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.65s ease-in-out;
        }

        .scene {
            width: 100%;
            height: 100%;
            perspective: 1500px;
            display: flex;
            justify-content: center;
            align-items: center;
            will-change: transform;
        }

        .camera {
            width: 0;
            height: 0;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(60deg) rotateZ(-45deg) scale(1);
            transition: transform 1.4s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        .shadow {
            position: absolute;
            width: var(--box-size);
            height: var(--box-size);
            top: -112.5px;
            left: -112.5px;
            background: rgba(0, 0, 0, 0.9);
            filter: blur(25px);
            transform: translateZ(-2px);
            animation: shadow-bob 3s ease-in-out infinite;
            border-radius: 20px;
        }

        .shadow.hidden {
            animation: none;
            opacity: 0;
            transition: opacity 0.8s ease-out;
        }

        .box-wrapper {
            position: absolute;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            animation: bob 3s ease-in-out infinite;
            cursor: pointer;
            will-change: transform;
        }

        .face {
            position: absolute;
            width: var(--box-size);
            height: var(--box-size);
            background-color: var(--box-color);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1),
                border-color 0.8s,
                box-shadow 0.8s,
                background-color 0.8s;
            will-change: transform;
        }

        .base {
            top: -112.5px;
            left: -112.5px;
        }

        #box-thumbnail {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 760px;
            height: 760px;
            /* Scales the 760px high-res canvas down to fit 82% of the 225px box (184.5px) */
            transform: translate(-50%, -50%) scale(0.24276);
            transform-origin: center center;
            display: block;
            pointer-events: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            transition: border-radius 1.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 1.4s ease;
        }

/* Modified resolution *MRC
        #box-thumbnail {
            position: absolute;
            inset: 0;
            width: 82%;
            height: 82%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            margin: auto;
            display: block;
            pointer-events: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            transition: border-radius 1.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 1.4s ease;
        }
*/
        .logo {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translateZ(-1px) rotateY(180deg) rotateZ(180deg);
            backface-visibility: hidden;
            pointer-events: none;
        }

        .logo img {
            width: 105px;
            height: 105px;
            object-fit: contain;
            opacity: 0.85;
        }

        /* Specific -90deg visual rotation for the left face */
        .left .logo {
            transform: translateZ(-1px) rotateY(180deg) rotateZ(90deg);
        }

        /* Hinges */
        .front {
            top: 100%;
            left: 0;
            transform-origin: top center;
        }

        .back {
            bottom: 100%;
            left: 0;
            transform-origin: bottom center;
        }

        .left {
            right: 100%;
            top: 0;
            transform-origin: right center;
        }

        .right {
            left: 100%;
            top: 0;
            transform-origin: left center;
        }

        .top {
            top: 100%;
            left: 0;
            transform-origin: top center;
        }

        .box-wrapper.folded .face {
            animation: face-pulse 3s ease-in-out infinite;
        }

        /* Folds */
        .box-wrapper.folded .front {
            transform: rotateX(90deg);
        }

        .box-wrapper.folded .back {
            transform: rotateX(-90deg);
        }

        .box-wrapper.folded .left {
            transform: rotateY(90deg);
        }

        .box-wrapper.folded .right {
            transform: rotateY(-90deg);
        }

        .box-wrapper.folded .top {
            transform: rotateX(90deg);
        }

        .front,
        .back,
        .left,
        .right,
        .top {
            transform: rotate3d(0, 0, 0, 0deg);
        }

        /* 3D Animations */
        @keyframes bob {

            0%,
            100% {
                transform: translate3d(0, 0, 45px);
            }

            50% {
                transform: translate3d(0, 0, 90px);
            }
        }

        @keyframes shadow-bob {

            0%,
            100% {
                transform: translateZ(-2px) scale(1);
                opacity: 0.7;
            }

            50% {
                transform: translateZ(-2px) scale(0.85);
                opacity: 0.3;
            }
        }

        @keyframes face-pulse {

            0%,
            100% {
                box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9), 0 0 5px rgba(255, 255, 255, 0.02);
            }

            50% {
                box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.75), 0 0 15px rgba(255, 255, 255, 0.08);
            }
        }

        .hint {
            position: absolute;
            bottom: 40px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 6px;
            font-size: 11px;
            text-transform: uppercase;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .hint.hidden {
            opacity: 0;
        }


        /* --- PHASE 2: PRESENTATION SLIDER --- */
        #presentation-app {
            position: absolute;
            inset: 0;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.65s ease-in-out;
            background: transparent;
        }

        #presentation-app.active {
            opacity: 1;
            pointer-events: auto;
        }

        #slider-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .slide {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            z-index: 1;
        }

        .slide.active {
            visibility: visible;
            z-index: 2;
        }

        .slide-inner {
            will-change: transform, opacity;
            opacity: 0;
        }

        .slide-inner.animating {
            transition: transform 1.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Slider States */
        .slide-inner[data-state="center"] {
            transform: translate(0, 0) scale(1) rotate(0deg);
            opacity: 1;
        }

        .slide-inner[data-state="left"] {
            transform: translate(-150vw, 0) scale(0.84) rotate(-11deg);
            opacity: 0;
        }

        .slide-inner[data-state="right"] {
            transform: translate(150vw, 0) scale(0.84) rotate(11deg);
            opacity: 0;
        }

        .slide-inner[data-state="top"] {
            transform: translate(0, -150vh) scale(0.84) rotate(-11deg);
            opacity: 0;
        }

        .slide-inner[data-state="bottom"] {
            transform: translate(0, 150vh) scale(0.84) rotate(11deg);
            opacity: 0;
        }

        .page-content {
            background-color: white;
            aspect-ratio: 1 / 1;
            width: min(78vh, 84vw);
            height: min(78vh, 84vw);
            max-width: 820px;
            max-height: 820px;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #1a1a1a;
            border-radius: 6px;
        }

        /* Progress Bar */
        #progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 50;
        }

        #progress-bar {
            height: 100%;
            background: #ffffff;
            width: 0;
            transition: width 0.7s ease-out;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body>

    <!-- PHASE 1: 3D UNBOXING SCENE -->
    <div id="unboxing-scene">
        <div class="scene">
            <div class="camera">
                <div class="shadow"></div>

                <div class="box-wrapper folded">
                    <!-- Base -->
                    <div class="face base">
                        <canvas id="box-thumbnail"></canvas>
                        <!-- Front & Lid -->
                        <div class="face front">
                            <div class="logo"><img class="box-logo-img" src="" alt="Brand Logo"></div>
                            <div class="face top">
                                <div class="logo"><img class="box-logo-img" src="" alt="Brand Logo"></div>
                            </div>
                        </div>
                        <!-- Back, Left, Right -->
                        <div class="face back">
                            <div class="logo"><img class="box-logo-img" src="" alt="Brand Logo"></div>
                        </div>
                        <div class="face left">
                            <div class="logo"><img class="box-logo-img" src="" alt="Brand Logo"></div>
                        </div>
                        <div class="face right">
                            <div class="logo"><img class="box-logo-img" src="" alt="Brand Logo"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="hint">Cliquez pour ouvrir la boîte</div>
    </div>


    <!-- PHASE 2: PRESENTATION SLIDER APP -->
    <div id="presentation-app">
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>

        <main id="slider-container">
            <!-- Dynamically Injected Slides -->
            <div id="loading-indicator"
                class="absolute inset-0 flex items-center justify-center z-50 text-white font-sans uppercase tracking-[0.3em] text-sm opacity-100 transition-opacity duration-500">
                <div class="animate-pulse">Loading Document...</div>
            </div>
        </main>
    </div>

    <!-- LOGIC SYSTEM -->
    <script>
        // =========================================================================
        // CENTRALIZED CONFIGURATION — UPDATE YOUR SOURCE URLS & FILENAME HERE
        // =========================================================================
        const CONFIG = {
            pdfUrl: 'https://NtertainR.github.io/BoiteNoire/PropTango2026.pdf',
            logoUrl: 'https://NtertainR.github.io/BoiteNoire/boitenoire.png',
            downloadFilename: 'Proposition.pdf'
        };
        // =========================================================================

        document.addEventListener('DOMContentLoaded', () => {

            // Dynamically apply logoUrl to all 5 exterior box faces
            document.querySelectorAll('.box-logo-img').forEach(img => {
                img.src = CONFIG.logoUrl;
            });

            // --- SYSTEM STATE & ELEMENTS ---
            const unboxingScene = document.getElementById('unboxing-scene');
            const presentationApp = document.getElementById('presentation-app');

            // 3D Elements
            const boxWrapper = document.querySelector('.box-wrapper');
            const camera = document.querySelector('.camera');
            const shadow = document.querySelector('.shadow');
            const base = document.querySelector('.base');
            const hint = document.querySelector('.hint');

            // PDF/Slider Elements
            const sliderContainer = document.getElementById('slider-container');
            const progressBar = document.getElementById('progress-bar');
            const loadingIndicator = document.getElementById('loading-indicator');
            const boxThumbnail = document.getElementById('box-thumbnail');

            // Initialize PDF Engine immediately on load so page 1 thumbnail is ready inside the box
            initializePresentationEngine();

            // --- CORE LOGIC: THE 3D UNBOXING ---
            let isUnboxing = false;

            boxWrapper.addEventListener('click', () => {
                if (isUnboxing) return;
                isUnboxing = true;

                // 1. Freeze Bobbing at current Z height
                const computedStyle = window.getComputedStyle(boxWrapper);
                const transformStr = computedStyle.transform;
                let currentZ = 45;
                if (transformStr.startsWith('matrix3d')) {
                    currentZ = parseFloat(transformStr.split(',')[14]);
                }

                boxWrapper.style.animation = 'none';
                void boxWrapper.offsetWidth; // Force Reflow

                // 2. Rapid Double Spin (720deg)
                boxWrapper.style.transition = 'transform 0.9s cubic-bezier(0.65, 0, 0.35, 1)';
                boxWrapper.style.transform = `translate3d(0, 0, ${currentZ}px) rotateZ(720deg)`;

                if (hint) hint.classList.add('hidden');

                // 3. Drop to Floor & Unfold All 6 Sides
                setTimeout(() => {
                    boxWrapper.style.transition = 'transform 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
                    boxWrapper.style.transform = 'translate3d(0, 0, 0) rotateZ(720deg)';
                    boxWrapper.classList.remove('folded');
                    shadow.classList.add('hidden');

                    // 4. Exact 1:1 Viewport-Matched Zoom Into Center Thumbnail
                    setTimeout(() => {
                        // Base box is 225px, thumbnail is 82% of base (184.5px)
                        const thumbnailPx = 225 * 0.82;
                        // Target slide matches CSS: min(78vh, 84vw, 820px)
                        const targetSlidePx = Math.min(window.innerHeight * 0.78, window.innerWidth * 0.84, 820);
                        const exactZoom = (targetSlidePx / thumbnailPx) * 1.03; // 5% bigger *MRC

                        // Cancel the box's 720deg spin cleanly and scale 1:1 to exact slide dimensions
                        camera.style.transform = `rotateX(0deg) rotateZ(0deg) scale(${exactZoom})`;

                        // Match the 6px rounded corners of .page-content at final scale
                        boxThumbnail.style.borderRadius = `${6 / exactZoom}px`;
                        boxThumbnail.style.boxShadow = 'none';

                        // Purify the black void edges
                        base.style.borderColor = 'transparent';
                        base.style.boxShadow = 'none';
                        base.style.backgroundColor = '#08080a';
/*
                        // 5. Crossfade Seamlessly into 2D Presentation Engine at zoom completion
                        setTimeout(() => {
                            presentationApp.classList.add('active');
                            unboxingScene.style.opacity = '0';

                            // Remove 3D scene from DOM and restore solid background after crossfade completes
                            setTimeout(() => {
                                presentationApp.style.background = 'var(--bg-color)';
                                unboxingScene.remove();
                            }, 700);
                        }, 1350);

                    }, 1200);
*/
                        // 5. Crossfade at 1.05x, then settle first slide back to 1.0x (the pulse)
                        setTimeout(() => {
                            const firstSlideInner = slides[0].querySelector('.slide-inner');

                            // Start slide 1 at the exact same 1.05x scale so the crossfade is invisible
                            firstSlideInner.style.transform = 'translate(0, 0) scale(1.03) rotate(0deg)';

                            presentationApp.classList.add('active');
                            unboxingScene.style.opacity = '0';

                            // Gently settle slide 1 from 1.05x down to 1.0x to complete the pulse
                            requestAnimationFrame(() => {
                                requestAnimationFrame(() => {
                                    firstSlideInner.style.transition = 'transform 0.1s cubic-bezier(0.22, 1, 0.36, 1)';
                                    firstSlideInner.style.transform = ''; // Returns smoothly to data-state="center" scale(1)
                                });
                            });

                            // Clean up inline transition and remove 3D scene
                            setTimeout(() => {
                                firstSlideInner.style.transition = '';
                                presentationApp.style.background = 'var(--bg-color)';
                                unboxingScene.remove();
                            }, 500);
                        }, 1350);

                    }, 1200);
                }, 900);
            });

            // --- CORE LOGIC: THE PDF ENGINE & SLIDER ---
            let sliderHTML = '';
            let slides = [];
            let currentIndex = 0;
            let isAnimatingSlide = false;

            async function initializePresentationEngine() {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

                try {
                    const loadingTask = pdfjsLib.getDocument(CONFIG.pdfUrl);
                    const pdf = await loadingTask.promise;

                    const totalPages = pdf.numPages;

                    for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                        const page = await pdf.getPage(pageNum);
                        // Originally scale was set to 2.5 but wanted more resolution *MRC
                        const scale = pageNum === 1 ? 5.0 : 2.5;
                        const viewport = page.getViewport({ scale: scale });

                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;

                        await page.render({ canvasContext: context, viewport: viewport }).promise;
                        const imgData = canvas.toDataURL('image/jpeg', 0.92);

                        // Render Page 1 into the 1:1 square thumbnail inside the 3D Box Base
                        if (pageNum === 1) {
                            const thumbSize = Math.max(viewport.width, viewport.height);
                            boxThumbnail.width = thumbSize;
                            boxThumbnail.height = thumbSize;
                            const thumbCtx = boxThumbnail.getContext('2d');
                            thumbCtx.fillStyle = '#ffffff';
                            thumbCtx.fillRect(0, 0, thumbSize, thumbSize);
                            const offsetX = (thumbSize - viewport.width) / 2;
                            const offsetY = (thumbSize - viewport.height) / 2;
                            thumbCtx.drawImage(canvas, offsetX, offsetY);
                        }

                        sliderHTML += `
                            <section class="slide">
                                <div class="slide-inner page-content" data-state="bottom">
                                    <img src="${imgData}" class="w-full h-full object-contain bg-white" alt="Page ${pageNum}" />
                                </div>
                            </section>
                        `;
                    }
                } catch (error) {
                    console.warn("PDF Load Failed (CORS or invalid URL). Using 1:1 square fallback slides.", error);

                    // Fallback Square Thumbnail (1000x1000) for the 3D Box
                    boxThumbnail.width = 1000;
                    boxThumbnail.height = 1000;
                    const thumbCtx = boxThumbnail.getContext('2d');
                    thumbCtx.fillStyle = '#ffffff';
                    thumbCtx.fillRect(0, 0, 1000, 1000);
                    thumbCtx.fillStyle = '#1a1a1a';
                    thumbCtx.font = 'bold 180px serif';
                    thumbCtx.textAlign = 'center';
                    thumbCtx.textBaseline = 'middle';
                    thumbCtx.fillText('01', 500, 460);
                    thumbCtx.fillStyle = '#6b7280';
                    thumbCtx.font = '600 28px sans-serif';
                    thumbCtx.fillText('SQUARE DOCUMENT PREVIEW', 500, 580);

                    for (let i = 1; i <= 5; i++) {
                        sliderHTML += `
                            <section class="slide">
                                <div class="slide-inner page-content p-10 md:p-14 flex flex-col items-center justify-center text-center bg-white" data-state="bottom">
                                    <h2 class="font-serif text-6xl mb-6 text-gray-300 border-b border-gray-100 w-full pb-4">0${i}</h2>
                                    <h3 class="font-sans uppercase tracking-[0.2em] text-xl text-ink font-bold mb-4">Square Format Page 0${i}</h3>
                                    <p class="text-gray-500 max-w-md text-sm leading-relaxed">If your hosted PDF is blocked by browser CORS policies, this 1:1 square fallback renders seamlessly. Scroll or swipe to advance.</p>
                                </div>
                            </section>
                        `;
                    }
                }

                // Epilogue Slide (1:1 Square) with Download Button
                sliderHTML += `
                    <section class="slide">
                        <div class="slide-inner page-content p-8 md:p-12 flex flex-col bg-[#0f0f11] text-paper relative overflow-hidden" data-state="bottom">
                            <header class="w-full border-b border-gray-700 pb-4 flex justify-between items-center relative z-10">
                                <span class="font-sans uppercase text-xs font-semibold tracking-widest text-gray-400">Assemblage</span>
                                <span class="font-sans uppercase text-xs font-semibold tracking-widest text-gray-400">Terminé</span>
                            </header>
                            
                            <div class="flex-grow flex flex-col justify-center items-center text-center relative z-10">
                                <img src="${CONFIG.logoUrl}" class="w-40 h-40 mb-8 object-contain" alt="Logo Boite Noire">
                                <h2 class="font-sans text-3xl md:text-5xl font-bold mb-4 text-white">Proposition assemblée</h2>
                                <p class="font-sans text-sm md:text-base text-gray-400 mb-10 max-w-sm">Le document est prêt à être téléchargé.</p>
                                
                                <button id="download-pdf-btn" type="button" class="group relative px-8 py-4 rounded-lg bg-white text-ink font-sans uppercase tracking-[0.2em] text-xs font-bold transition-all hover:bg-gray-200 hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-3 w-full max-w-xs shadow-[0_15px_30px_-10px_rgba(255,255,255,0.2)] cursor-pointer">
                                    <span>Télécharger le PDF</span>
                                    <svg class="w-4 h-4 transition-transform group-hover:translate-y-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                    </svg>
                                </button>
                            </div>
                            
                            <footer class="mt-auto w-full border-t border-gray-700 pt-6 flex justify-between items-end relative z-10">
                                <div class="font-sans uppercase text-[9px] tracking-widest text-gray-500">Système autorisé</div>
                                <div class="text-right text-[10px] font-sans text-gray-500">FIN</div>
                            </footer>
                        </div>
                    </section>
                `;

                // Render into DOM
                sliderContainer.innerHTML = sliderHTML;
                if (loadingIndicator) loadingIndicator.style.opacity = '0';

                // Attach Download Handler using CONFIG.pdfUrl & CONFIG.downloadFilename
                const downloadBtn = document.getElementById('download-pdf-btn');
                if (downloadBtn) {
                    downloadBtn.addEventListener('click', async () => {
                        const label = downloadBtn.querySelector('span');
                        const originalText = label.textContent;
                        label.textContent = 'Preparing...';
                        try {
                            const response = await fetch(CONFIG.pdfUrl);
                            if (!response.ok) throw new Error('Network response was not ok');
                            const blob = await response.blob();
                            const blobUrl = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = blobUrl;
                            a.download = CONFIG.downloadFilename;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            URL.revokeObjectURL(blobUrl);
                        } catch (err) {
                            // Fallback direct open if cross-origin blob fetch is restricted
                            const a = document.createElement('a');
                            a.href = CONFIG.pdfUrl;
                            a.download = CONFIG.downloadFilename;
                            a.target = '_blank';
                            a.rel = 'noopener noreferrer';
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                        } finally {
                            label.textContent = originalText;
                        }
                    });
                }

                slides = document.querySelectorAll('.slide');
                setupSliderControls();
            }

            function updateProgress() {
                if (!slides.length) return;
                const percent = ((currentIndex + 1) / slides.length) * 100;
                progressBar.style.width = `${percent}%`;
            }

            function setupSliderControls() {
                if (slides.length > 0) {
                    slides[0].classList.add('active');
                    slides[0].querySelector('.slide-inner').dataset.state = 'center';
                    updateProgress();
                }

                // Slider Navigation Logic
                const goToSlide = (nextIndex) => {
                    if (isAnimatingSlide || nextIndex < 0 || nextIndex >= slides.length || nextIndex === currentIndex) return;

                    isAnimatingSlide = true;
                    const currentSlide = slides[currentIndex];
                    const nextSlide = slides[nextIndex];
                    const currentInner = currentSlide.querySelector('.slide-inner');
                    const nextInner = nextSlide.querySelector('.slide-inner');

                    // Random direction push
                    const directions = ['left', 'right', 'top', 'bottom'];
                    const inDir = directions[Math.floor(Math.random() * directions.length)];
                    const opposites = { 'left': 'right', 'right': 'left', 'top': 'bottom', 'bottom': 'top' };
                    const outDir = opposites[inDir];

                    nextInner.dataset.state = inDir;
                    nextSlide.classList.add('active');

                    // Force Reflow
                    void nextInner.offsetWidth;
                    void currentInner.offsetWidth;

                    nextInner.classList.add('animating');
                    currentInner.classList.add('animating');

                    nextInner.dataset.state = 'center';
                    currentInner.dataset.state = outDir;

                    setTimeout(() => {
                        nextInner.classList.remove('animating');
                        currentInner.classList.remove('animating');
                        currentSlide.classList.remove('active');

                        currentIndex = nextIndex;
                        updateProgress();
                        isAnimatingSlide = false;
                    }, 1350);
                };

                // Wheel Support
                let scrollTimeout;
                window.addEventListener('wheel', (e) => {
                    if (!presentationApp.classList.contains('active')) return;
                    if (Math.abs(e.deltaY) > 20) {
                        clearTimeout(scrollTimeout);
                        scrollTimeout = setTimeout(() => {
                            if (e.deltaY > 0) goToSlide(currentIndex + 1);
                            else if (e.deltaY < 0) goToSlide(currentIndex - 1);
                        }, 50);
                    }
                }, { passive: true });

                // Keyboard Support (Arrow Keys, PageUp/PageDown, Space)
                window.addEventListener('keydown', (e) => {
                    if (!presentationApp.classList.contains('active')) return;
                    if (['ArrowDown', 'ArrowRight', 'PageDown', ' '].includes(e.key)) {
                        e.preventDefault();
                        goToSlide(currentIndex + 1);
                    } else if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key)) {
                        e.preventDefault();
                        goToSlide(currentIndex - 1);
                    }
                });

                // Touch Swipe Support
                let touchStartY = 0;
                let touchStartX = 0;
                window.addEventListener('touchstart', (e) => {
                    if (!presentationApp.classList.contains('active')) return;
                    touchStartY = e.touches[0].clientY;
                    touchStartX = e.touches[0].clientX;
                }, { passive: true });

                window.addEventListener('touchend', (e) => {
                    if (!presentationApp.classList.contains('active')) return;
                    const touchEndY = e.changedTouches[0].clientY;
                    const touchEndX = e.changedTouches[0].clientX;
                    const diffY = touchStartY - touchEndY;
                    const diffX = touchStartX - touchEndX;

                    if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 50) {
                        if (diffY > 0) goToSlide(currentIndex + 1);
                        else goToSlide(currentIndex - 1);
                    } else if (Math.abs(diffX) > 50) {
                        if (diffX > 0) goToSlide(currentIndex + 1);
                        else goToSlide(currentIndex - 1);
                    }
                }, { passive: true });
            }
        });
    </script>
</body>

</html>
